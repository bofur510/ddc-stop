<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4e6b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>동두천 정류소 현장조사</title>
<style>
:root{
  --gov:#4e6b12; --gov-dk:#3a5009; --gov-br:#8cb61c; --gov-pale:#f2f6ea;
  --ink:#14171c; --sub:#4a4f57; --dim:#8a8f97;
  --line:#d7dae0; --line-lt:#e9ebef; --paper:#fafbfc;
  --warn:#c0392b; --ok:#2f7d5c;
  --ui:-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  --mono:"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;font-family:var(--ui);color:var(--ink);
  background:var(--paper);font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column}

/* 머리말 */
.top{background:var(--gov);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  flex:none}
.top h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.top p{margin:2px 0 0;font-size:11px;opacity:.85}
.sum{display:flex;gap:10px;margin-top:8px;font-size:11.5px}
.sum b{font-family:var(--mono);font-size:15px;display:block;font-weight:700}

/* 검색 */
.bar{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}
.bar input{width:100%;height:40px;padding:0 12px;font-size:15px;font-family:inherit;
  border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;font-size:13px;border:1px solid var(--line);
  border-radius:20px;background:#fff;color:var(--sub);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gov);border-color:var(--gov);color:#fff;font-weight:600}

/* 화면 전환 */
.tabs{flex:none;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px;border:0;background:none;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--dim);border-bottom:2.5px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--gov);border-bottom-color:var(--gov)}

/* 지도 */
.mapwrap{flex:1;position:relative;overflow:hidden;background:#eef1f4;touch-action:none}
.mapwrap canvas{display:block;width:100%;height:100%}
.mapinfo{position:absolute;left:10px;right:74px;bottom:10px;background:rgba(255,255,255,.96);
  border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);
  line-height:1.45}
.mapinfo b{font-size:15px;display:block;margin-bottom:2px;letter-spacing:-.02em}
.mapinfo em{font-style:normal;color:var(--dim);font-size:11.5px}
.mapinfo button{margin-top:8px;width:100%;padding:10px;border:0;border-radius:7px;
  background:var(--gov);color:#fff;font-family:inherit;font-size:13.5px;font-weight:600}
.mapzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.mapzoom button{width:38px;height:38px;border:1px solid var(--line);background:rgba(255,255,255,.96);
  border-radius:8px;font-size:19px;color:var(--sub);font-family:inherit}

/* 목록 */
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.item{background:#fff;border-bottom:1px solid var(--line-lt);padding:11px 14px;
  display:flex;gap:10px;align-items:flex-start}
.item:active{background:var(--gov-pale)}
.mk{flex:none;width:11px;height:11px;margin-top:4px;border:1.5px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mk.밀폐형{background:#3a5009;border-radius:2px}
.mk.개방형{background:#8cb61c;border-radius:50%}
.mk.표지판형{background:#8c8c82;transform:rotate(45deg)}
.mk.미확인{background:#fff;border:2px solid #cdcdc2;border-radius:50%;box-shadow:none}
.it-b{flex:1;min-width:0}
.it-n{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.it-s{font-size:12px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-f{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.f{font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--gov-pale);
  color:var(--gov-dk);font-weight:600}
.f.no{background:#f4f5f7;color:var(--dim);font-weight:400}
.it-d{flex:none;text-align:right;font-family:var(--mono);font-size:12px;color:var(--gov);
  font-weight:700;padding-top:2px}
.it-d em{display:block;font-style:normal;font-size:10px;color:var(--dim);font-weight:400}

/* 상세 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,23,28,.45);
  display:none;align-items:flex-end}
.sheet.on{display:flex}
.sh{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:0 0 calc(env(safe-area-inset-bottom) + 16px)}
.sh-h{position:sticky;top:0;background:#fff;padding:14px 16px 10px;
  border-bottom:2px solid var(--gov);display:flex;align-items:flex-start;gap:10px}
.sh-h h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;flex:1;line-height:1.25}
.sh-h button{flex:none;width:30px;height:30px;border:0;background:var(--paper);
  border-radius:50%;font-size:17px;color:var(--sub)}
.sh-b{padding:12px 16px}
table.d{width:100%;border-collapse:collapse;font-size:13.5px}
table.d th,table.d td{padding:7px 8px;border-bottom:1px solid var(--line-lt);text-align:left}
table.d th{width:82px;color:var(--sub);font-weight:500;background:var(--paper)}
table.d td{font-family:var(--mono)}
table.d td.tx{font-family:var(--ui)}
.sec{font-size:11.5px;font-weight:700;color:var(--gov);letter-spacing:.06em;
  margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:16px}
.acts a,.acts button{flex:1;text-align:center;padding:12px;border-radius:8px;
  font-size:14px;font-weight:600;text-decoration:none;border:0;font-family:inherit}
.acts .go{background:var(--gov);color:#fff}
.acts .chk{background:#fff;color:var(--gov);border:1.5px solid var(--gov)}
.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin:10px 0 0}

/* 점검 */
.chks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chks label{font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;display:flex;align-items:center;gap:6px}
.chks input{width:17px;height:17px;accent-color:var(--gov)}
textarea{width:100%;min-height:70px;padding:10px;font-size:14px;font-family:inherit;
  border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--paper)}
.saved{font-size:11.5px;color:var(--ok);font-weight:600;margin-top:6px}

.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}
.gps{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;
  width:52px;height:52px;border-radius:50%;background:var(--gov);color:#fff;border:0;
  box-shadow:0 3px 12px rgba(0,0,0,.28);font-size:12px;font-weight:700;line-height:1.2}
.gps.on{background:var(--gov-dk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:60;
  background:rgba(20,23,28,.9);color:#fff;padding:10px 16px;border-radius:20px;
  font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<div class="top">
  <h1>동두천 버스정류소 현장조사</h1>
  <p>교통행정과 · 인터넷 없이 쓸 수 있습니다 · v1.10 (2026.09.22)</p>
  <div class="sum">
    <span><b id="s-n">0</b>정류소</span>

</div>

<div class="bar">

  <div class="chips" id="chips"></div>
</div>
<div class="tabs">
  <button type="button" id="t-list" aria-pressed="true">목록</button>
  <button type="button" id="t-map" aria-pressed="false">지도</button>
</div>

<div class="list" id="list"></div>
<div class="mapwrap" id="mapwrap" hidden>

  <div class="mapzoom">
    <button type="button" id="z-in">+</button>
    <button type="button" id="z-out">−</button>
  </div>
</div>

<button class="gps" id="gps">내 위치</button>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet"><div class="sh">
  <div class="sh-h"><h2 id="sh-n"></h2><button id="sh-x">✕</button></div>

</div></div>

/* 미리 담아 둔 지도 배경. 현장앱_지도담기.py 가 채워 넣는다 */
var TILES = {};
var TILE_Z = [];

var CLS = ["밀폐형","개방형","표지판형","미확인"];
var on = {}, near = false, myPos = null, cur = null;
CLS.forEach(function(c){ on[c] = true; });

/* 점검 기록 — 휴대폰 안에 저장된다 */
function load(){ try { return JSON.parse(localStorage.getItem("ddc_chk") || "{}"); }
                 catch(e){ return {}; } }
function save(d){ try { localStorage.setItem("ddc_chk", JSON.stringify(d)); } catch(e){} }
var CHK = load();

function esc(v){ return String(v == null ? "" : v)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function dist(a, b){
  var dy = (a.y - b.lat) * 111000;
  var dx = (a.x - b.lon) * 111000 * Math.cos(a.y * Math.PI / 180);
  return Math.sqrt(dy*dy + dx*dx);
}

function toast(t){
  var el = document.getElementById("toast");
  el.textContent = t; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("on"); }, 2200);
}

function renderChips(){
  var box = document.getElementById("chips");
  box.innerHTML = CLS.map(function(c){
    var n = STOPS.filter(function(s){ return s.c === c; }).length;
    return '<button class="chip" data-c="' + c + '" aria-pressed="' + (on[c] ? "true" : "false") +
           '">' + c + ' ' + n + '</button>';
  }).join("") +
  '<button class="chip" data-c="_chk" aria-pressed="false">미점검만</button>';
  box.onclick = function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    var k = b.dataset.c;
    if (k === "_chk"){ b.setAttribute("aria-pressed",
      b.getAttribute("aria-pressed") === "true" ? "false" : "true"); }
    else { on[k] = !on[k]; b.setAttribute("aria-pressed", on[k] ? "true" : "false"); }
    render();
  };
}

function filtered(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var onlyChk = document.querySelector('.chip[data-c="_chk"]');
  onlyChk = onlyChk && onlyChk.getAttribute("aria-pressed") === "true";
  var out = STOPS.filter(function(s){
    if (!on[s.c]) return false;
    if (onlyChk && CHK[s.a]) return false;
    if (!q) return true;
    return (s.n + " " + s.a + " " + s.d + " " + s.ad).toLowerCase().indexOf(q) >= 0;
  });
  if (near && myPos){
    out.forEach(function(s){ s._d = dist(s, myPos); });
    out.sort(function(a, b){ return a._d - b._d; });
  } else {
    out.sort(function(a, b){
      return (a.d || "").localeCompare(b.d || "") || String(a.a).localeCompare(String(b.a));
    });
  }
  return out;
}

function facs(s){
  var f = [];
  if (s.bit) f.push(["BIT", 1]);
  if (s.st) f.push(["의자", 1]);
  if (s.fan) f.push(["송풍기", 1]);
  if (s.sm) f.push(["스마트", 1]);
  if (s.lt) f.push(["조명", 1]);
  if (!f.length) f.push(["시설 없음", 0]);
  return f;
}

function render(){
  var rows = filtered();
  var box = document.getElementById("list");
  if (!rows.length){
    box.innerHTML = '<p class="empty">조건에 맞는 정류소가 없습니다.</p>';
    return;
  }
  box.innerHTML = rows.slice(0, 500).map(function(s){
    var d = (near && myPos && s._d != null)
      ? (s._d < 1000 ? Math.round(s._d) + "m" : (s._d/1000).toFixed(1) + "km") : "";
    return '<div class="item" data-a="' + esc(s.a) + '">' +
      '<i class="mk ' + s.c + '"></i>' +
      '<div class="it-b">' +
        '<div class="it-n">' + esc(s.n) + (CHK[s.a] ? ' ✓' : '') + '</div>' +
        '<div class="it-s">' + esc(s.a) + ' · ' + esc(s.d) + ' · ' + esc(s.c) + '</div>' +
        '<div class="it-f">' + facs(s).map(function(x){
          return '<span class="f' + (x[1] ? '' : ' no') + '">' + esc(x[0]) + '</span>';
        }).join("") + '</div>' +
      '</div>' +
      (d ? '<div class="it-d">' + d + '<em>거리</em></div>'
         : (s.r ? '<div class="it-d">' + s.r.toLocaleString() + '<em>승차/월</em></div>' : '')) +
    '</div>';
  }).join("");
  box.onclick = function(e){
    var it = e.target.closest(".item"); if (!it) return;
    open(STOPS.filter(function(s){ return String(s.a) === it.dataset.a; })[0]);
  };
  document.getElementById("s-n").textContent = rows.length;
  document.getElementById("s-b").textContent = rows.filter(function(s){ return s.bit; }).length;
  document.getElementById("s-c").textContent = Object.keys(CHK).length;
  if (view === "map") drawMap();
}

function open(s){
  if (!s) return;
  cur = s;
  document.getElementById("sh-n").textContent = s.n;
  var c = CHK[s.a] || {};
  var rows = [
    ["관리번호", s.a, 1], ["정류소ID", s.i, 1], ["행정동", s.d, 0],
    ["형태", s.c, 0], ["정류소유형", s.ty, 0], ["소재지", s.ad, 0],
  ].filter(function(r){ return r[1]; });

  var fac = [
    ["BIT", s.bit ? s.bit + "년" : ""],
    ["냉·온열의자", s.st ? s.st + (s.sy ? " " + s.sy + "년" : "") : ""],
    ["송풍기", s.fan ? s.fan + "년" : ""],
    ["조명", s.lt ? "설치" : ""],
    ["전동방풍막", s.wb ? "설치" : ""],
    ["WiFi", s.wf ? s.wf + "년" : ""],
    ["스마트승강장", s.sm ? (s.ac ? s.ac + "년 " + (s.af || "") : "해당") : ""],
  ];
  var has = fac.filter(function(f){ return f[1]; });
  var no = fac.filter(function(f){ return !f[1]; }).map(function(f){ return f[0]; });

  var html = '<table class="d"><tbody>' +
    rows.map(function(r){
      return '<tr><th>' + esc(r[0]) + '</th><td class="' + (r[2] ? '' : 'tx') + '">' +
             esc(r[1]) + '</td></tr>';
    }).join("") + '</tbody></table>';

  html += '<div class="sec">시설 보유현황</div>';
  html += has.length
    ? '<table class="d"><tbody>' + has.map(function(f){
        return '<tr><th>' + esc(f[0]) + '</th><td class="tx">' + esc(f[1]) + '</td></tr>';
      }).join("") + '</tbody></table>'
    : '<p class="note">설치된 시설이 없습니다.</p>';
  if (no.length) html += '<p class="note">미설치 : ' + esc(no.join(" · ")) + '</p>';

  if (s.r) html += '<p class="note">월평균 승차 ' + s.r.toLocaleString() +
    '명 (2025.1~2026.6 평균)</p>';

  html += '<div class="sec">현장 점검</div>';
  html += '<div class="chks">' +
    [["ok","시설 정상"],["bad","파손·고장"],["clean","청소 필요"],["move","위치 부적정"]]
    .map(function(x){
      return '<label><input type="checkbox" data-k="' + x[0] + '"' +
             (c[x[0]] ? " checked" : "") + '>' + x[1] + '</label>';
    }).join("") + '</div>';
  html += '<textarea id="memo" placeholder="특이사항을 적어두세요">' +
          esc(c.memo || "") + '</textarea>';
  html += '<div class="saved" id="saved">' +
          (c.at ? "저장됨 · " + esc(c.at) : "") + '</div>';

  html += '<div class="acts">' +
    '<a class="go" href="https://map.kakao.com/link/to/' +
      encodeURIComponent(s.n) + ',' + s.y + ',' + s.x + '" target="_blank">길찾기</a>' +
    '<button class="chk" id="btn-save">점검 저장</button></div>';
  html += '<p class="note">점검 기록은 이 휴대폰에만 저장됩니다. ' +
    '사무실에서 정리하시려면 목록 맨 위 검색칸에 <b>내보내기</b> 라고 입력하세요.</p>';

  document.getElementById("sh-b").innerHTML = html;
  document.getElementById("sheet").classList.add("on");

  document.getElementById("btn-save").onclick = function(){
    var rec = { memo: document.getElementById("memo").value.trim(),
                at: new Date().toLocaleString("ko-KR", { dateStyle:"short", timeStyle:"short" }) };
    document.querySelectorAll('#sh-b input[type=checkbox]').forEach(function(cb){
      if (cb.checked) rec[cb.dataset.k] = 1;
    });
    var keys = Object.keys(rec).filter(function(k){ return k !== "at"; });
    if (!keys.some(function(k){ return rec[k]; })) delete CHK[s.a];
    else CHK[s.a] = rec;
    save(CHK);
    document.getElementById("saved").textContent = "저장됨 · " + rec.at;
    toast("점검 기록을 저장했습니다");
    render();
  };
}

/* 내보내기 — 검색칸에 "내보내기" 입력 */
function exportCSV(){
  var keys = Object.keys(CHK);
  if (!keys.length){ toast("저장된 점검 기록이 없습니다"); return; }
  var lines = ["정류장번호,정류소명,행정동,시설정상,파손고장,청소필요,위치부적정,특이사항,점검일시"];
  keys.forEach(function(a){
    var s = STOPS.filter(function(x){ return String(x.a) === String(a); })[0] || {};
    var c = CHK[a];
    lines.push([a, s.n || "", s.d || "", c.ok ? "O" : "", c.bad ? "O" : "",
                c.clean ? "O" : "", c.move ? "O" : "",
                (c.memo || "").replace(/[",\n]/g, " "), c.at || ""]
               .map(function(v){ return '"' + v + '"'; }).join(","));
  });
  var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "정류소점검_" + new Date().toISOString().slice(0,10).replace(/-/g,"") + ".csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(keys.length + "건을 내려받았습니다");
}

document.getElementById("sh-x").onclick = function(){
  document.getElementById("sheet").classList.remove("on");
};
document.getElementById("sheet").onclick = function(e){
  if (e.target.id === "sheet") this.classList.remove("on");
};
document.getElementById("q").oninput = function(){
  if (this.value.trim() === "내보내기"){ this.value = ""; exportCSV(); return; }
  render();
};

/* 내 위치 — 켜두면 이동에 따라 계속 갱신된다 */
var watchId = null;

function stopGPS(){
  if (watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  near = false; myPos = null;
  var btn = document.getElementById("gps");
  btn.classList.remove("on"); btn.textContent = "내 위치";
  render(); if (view === "map") drawMap();
}

document.getElementById("gps").onclick = function(){
  var btn = this;
  if (watchId != null){ stopGPS(); toast("위치 표시를 껐습니다"); return; }
  if (!navigator.geolocation){ toast("이 기기에서는 위치를 쓸 수 없습니다"); return; }

  btn.textContent = "찾는 중";
  var first = true;
  watchId = navigator.geolocation.watchPosition(function(p){
    myPos = { lat: p.coords.latitude, lon: p.coords.longitude,
              acc: p.coords.accuracy || 0 };
    near = true;
    btn.classList.add("on");
    btn.textContent = view === "map" ? "위치 켬" : "가까운 순";
    if (first){
      first = false;
      /* 지도에서는 내 위치로 이동한다 */
      if (view === "map"){ mapC = { y: myPos.lat, x: myPos.lon }; mapZ = Math.max(mapZ, 6); }
      toast("내 위치를 찾았습니다 (오차 약 " + Math.round(myPos.acc) + "m)");
    }
    render();
    if (view === "map") drawMap();
  }, function(err){
    btn.textContent = "내 위치";
    if (watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    toast(err && err.code === 1
      ? "위치 권한이 꺼져 있습니다. 설정에서 허용해 주세요"
      : "위치를 확인하지 못했습니다. 실외에서 다시 시도해 주세요");
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
};


/* ══ 지도 ══════════════════════════════════════════════
   지도 배경(타일)은 인터넷이 필요하므로 쓰지 않는다.
   좌표를 직접 그려 정류소와 내 위치를 표시한다. */
var view = "list", cv, ctx, mapC = null, mapZ = 1, sel = null;
var DRAW = { pad: 26 };

function bounds(rows){
  var la = rows.map(function(s){ return s.y; });
  var lo = rows.map(function(s){ return s.x; });
  if (myPos){ la.push(myPos.lat); lo.push(myPos.lon); }
  if (!la.length) return null;
  return { y0: Math.min.apply(null, la), y1: Math.max.apply(null, la),
           x0: Math.min.apply(null, lo), x1: Math.max.apply(null, lo) };
}

function drawMap(){
  if (view !== "map" || !cv) return;
  var rows = filtered();
  var w = cv.clientWidth, h = cv.clientHeight;
  var dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var b = bounds(rows);
  if (!b){ return; }
  if (!mapC) mapC = { y: (b.y0 + b.y1) / 2, x: (b.x0 + b.x1) / 2 };

  ctx.fillStyle = "#eef1f4"; ctx.fillRect(0, 0, w, h);

  /* 위경도 → 화면. 가로세로 비율을 위도로 보정한다 */
  var kx = Math.cos(mapC.y * Math.PI / 180);
  var spanY = Math.max(b.y1 - b.y0, 0.004) * 1.12 / mapZ;
  var spanX = Math.max((b.x1 - b.x0) * kx, 0.004) * 1.12 / mapZ;
  var sc = Math.min((h - DRAW.pad * 2) / spanY, (w - DRAW.pad * 2) / spanX);

  function P(s){
    return { x: w/2 + ((s.x - mapC.x) * kx) * sc,
             y: h/2 - (s.y - mapC.y) * sc };
  }

  /* 지도 배경 — 담아 둔 타일이 있으면 그린다 */
  drawTiles(w, h, sc, kx);

  /* 축척 막대 */
  var mPerPx = 111000 / sc;
  var want = [50,100,200,500,1000,2000,5000].filter(function(m){ return m/mPerPx < w*0.35; }).pop() || 50;
  var barW = want / mPerPx;
  ctx.strokeStyle = "#5a5f66"; ctx.lineWidth = 2;
  var by = 26;
  ctx.beginPath(); ctx.moveTo(14, by); ctx.lineTo(14 + barW, by);
  ctx.moveTo(14, by - 4); ctx.lineTo(14, by + 4);
  ctx.moveTo(14 + barW, by - 4); ctx.lineTo(14 + barW, by + 4); ctx.stroke();
  ctx.fillStyle = "#4a4f57"; ctx.font = "11px -apple-system,sans-serif";
  ctx.fillText(want >= 1000 ? (want/1000) + "km" : want + "m", 14, by - 8);

  var COL = { "밀폐형":"#3a5009", "개방형":"#8cb61c", "표지판형":"#8c8c82", "미확인":"#cdcdc2" };
  var pts = [];
  rows.forEach(function(s){
    var p = P(s); p.s = s; pts.push(p);
    if (p.x < -20 || p.x > w+20 || p.y < -20 || p.y > h+20) return;
    var isSel = sel && sel.a === s.a;
    var r = isSel ? 9 : 6;
    ctx.beginPath();
    if (s.c === "표지판형"){
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.PI/4);
      ctx.rect(-r*0.72, -r*0.72, r*1.44, r*1.44); ctx.restore();
    } else if (s.c === "밀폐형"){
      ctx.rect(p.x - r*0.8, p.y - r*0.8, r*1.6, r*1.6);
    } else {
      ctx.arc(p.x, p.y, r, 0, 6.284);
    }
    ctx.fillStyle = COL[s.c] || "#999";
    ctx.fill();
    ctx.lineWidth = isSel ? 3 : 1.5;
    ctx.strokeStyle = isSel ? "#c0392b" : "#fff";
    ctx.stroke();
    if (CHK[s.a]){
      ctx.beginPath(); ctx.arc(p.x + r, p.y - r, 3.5, 0, 6.284);
      ctx.fillStyle = "#2f7d5c"; ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    }
  });
  mapPts = pts;

  /* 내 위치 — 파란 점과 정확도 원 */
  if (myPos){
    var mp = P({ y: myPos.lat, x: myPos.lon });
    if (myPos.acc){
      var ar = (myPos.acc / 111000) * sc;
      if (ar > 6){
        ctx.beginPath(); ctx.arc(mp.x, mp.y, ar, 0, 6.284);
        ctx.fillStyle = "rgba(26,115,232,.14)"; ctx.fill();
        ctx.strokeStyle = "rgba(26,115,232,.35)"; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    ctx.beginPath(); ctx.arc(mp.x, mp.y, 9, 0, 6.284);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(mp.x, mp.y, 6.5, 0, 6.284);
    ctx.fillStyle = "#1a73e8"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
    ctx.fillStyle = "#1a73e8"; ctx.font = "bold 11px -apple-system,sans-serif";
    ctx.fillText("내 위치", mp.x + 13, mp.y + 4);
  }
}

var mapPts = [];
var tileImgs = {};

function lon2tx(lon, z){ return (lon + 180) / 360 * Math.pow(2, z); }
function lat2ty(lat, z){
  var r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z);
}

function drawTiles(w, h, sc, kx){
  if (!TILES || !TILE_Z || !TILE_Z.length) return;

  /* 지금 배율에 가장 가까운 타일 단계를 고른다 */
  var mPerPx = 111000 / sc;
  var best = TILE_Z[0], bd = 1e9;
  TILE_Z.forEach(function(z){
    var tm = 156543.03 * Math.cos(mapC.y * Math.PI / 180) / Math.pow(2, z);
    var d = Math.abs(Math.log(tm / mPerPx));
    if (d < bd){ bd = d; best = z; }
  });
  var z = best, n = Math.pow(2, z);

  /* 화면 네 귀퉁이의 위경도 */
  var y0 = mapC.y + (h/2) / sc, y1 = mapC.y - (h/2) / sc;
  var x0 = mapC.x - (w/2) / (sc * kx), x1 = mapC.x + (w/2) / (sc * kx);
  /* 타일 번호는 위도가 커질수록 작아진다. 대소를 정리해 쓴다. */
  var ax = Math.floor(lon2tx(x0, z)), bx = Math.floor(lon2tx(x1, z));
  var ay = Math.floor(lat2ty(y0, z)), by = Math.floor(lat2ty(y1, z));
  var tx0 = Math.min(ax, bx), tx1 = Math.max(ax, bx);
  var ty0 = Math.min(ay, by), ty1 = Math.max(ay, by);

  for (var tx = tx0; tx <= tx1; tx++){
    for (var ty = ty0; ty <= ty1; ty++){
      var key = z + "/" + tx + "/" + ty;
      var src = TILES[key];
      if (!src) continue;
      var img = tileImgs[key];
      if (!img){
        img = new Image();
        img.onload = function(){ if (view === "map") drawMap(); };
        img.src = src;
        tileImgs[key] = img;
      }
      if (!img.complete || !img.naturalWidth) continue;
      /* 타일 네 귀퉁이를 화면 좌표로 */
      var lonA = tx / n * 360 - 180, lonB = (tx + 1) / n * 360 - 180;
      var latA = Math.atan(Math.sinh(Math.PI * (1 - 2 * ty / n))) * 180 / Math.PI;
      var latB = Math.atan(Math.sinh(Math.PI * (1 - 2 * (ty + 1) / n))) * 180 / Math.PI;
      var px = w/2 + ((lonA - mapC.x) * kx) * sc;
      var py = h/2 - (latA - mapC.y) * sc;
      var pw = ((lonB - lonA) * kx) * sc;
      var ph = (latA - latB) * sc;
      ctx.drawImage(img, px, py, pw + 0.6, ph + 0.6);
    }
  }
}

function mapPick(px, py){
  var best = null, bd = 1e9;
  mapPts.forEach(function(p){
    var d = (p.x - px) * (p.x - px) + (p.y - py) * (p.y - py);
    if (d < bd){ bd = d; best = p; }
  });
  if (!best || bd > 40 * 40) return null;
  return best.s;
}

function showMapInfo(s){
  var box = document.getElementById("mapinfo");
  if (!s){ box.innerHTML = "지도를 눌러 정류소를 선택하세요"; return; }
  var d = "";
  if (myPos){
    var m = dist(s, myPos);
    d = m < 1000 ? Math.round(m) + "m" : (m/1000).toFixed(1) + "km";
  }
  box.innerHTML = '<b>' + esc(s.n) + (CHK[s.a] ? " ✓" : "") + '</b>' +
    '<em>' + esc(s.a) + ' · ' + esc(s.d) + ' · ' + esc(s.c) +
    (d ? ' · ' + d : '') + '</em>' +
    '<button type="button" id="mi-open">상세 보기</button>';
  document.getElementById("mi-open").onclick = function(){ open(s); };
}

function setView(v){
  view = v;
  document.getElementById("list").hidden = (v !== "list");
  document.getElementById("mapwrap").hidden = (v !== "map");
  document.getElementById("t-list").setAttribute("aria-pressed", v === "list" ? "true" : "false");
  document.getElementById("t-map").setAttribute("aria-pressed", v === "map" ? "true" : "false");
  var gb = document.getElementById("gps");
  if (gb && myPos) gb.textContent = (v === "map") ? "위치 켬" : "가까운 순";
  if (v === "map"){
    if (!cv){
      cv = document.getElementById("cv"); ctx = cv.getContext("2d");
      var drag = null;
      cv.addEventListener("pointerdown", function(e){
        drag = { x: e.clientX, y: e.clientY, moved: 0 };
        cv.setPointerCapture(e.pointerId);
      });
      cv.addEventListener("pointermove", function(e){
        if (!drag) return;
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        drag.moved += Math.abs(dx) + Math.abs(dy);
        drag.x = e.clientX; drag.y = e.clientY;
        if (!mapC) return;
        var h = cv.clientHeight;
        var rows = filtered(), b = bounds(rows);
        if (!b) return;
        var kx = Math.cos(mapC.y * Math.PI / 180);
        var spanY = Math.max(b.y1 - b.y0, 0.004) * 1.12 / mapZ;
        var sc = (h - DRAW.pad * 2) / spanY;
        mapC.y += dy / sc; mapC.x -= dx / (sc * kx);
        drawMap();
      });
      cv.addEventListener("pointerup", function(e){
        if (drag && drag.moved < 8){
          var r = cv.getBoundingClientRect();
          var s2 = mapPick(e.clientX - r.left, e.clientY - r.top);
          sel = s2; showMapInfo(s2); drawMap();
        }
        drag = null;
      });
      document.getElementById("z-in").onclick = function(){ mapZ = Math.min(24, mapZ * 1.6); drawMap(); };
      document.getElementById("z-out").onclick = function(){ mapZ = Math.max(1, mapZ / 1.6); drawMap(); };
    }
    setTimeout(drawMap, 30);
    if (!window.__mapHi){
      window.__mapHi = 1;
      setTimeout(function(){
        toast(TILE_Z && TILE_Z.length
          ? "오른쪽 아래 [내 위치] 를 누르면 현재 위치가 표시됩니다"
          : "지도 배경이 담겨 있지 않습니다 · 정류소 위치만 표시됩니다");
      }, 500);
    }
  }
}

document.getElementById("t-list").onclick = function(){ setView("list"); };
document.getElementById("t-map").onclick = function(){ setView("map"); };
window.addEventListener("resize", function(){ if (view === "map") drawMap(); });

renderChips();
render();

if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
